---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Install required packages
  ansible.builtin.apt:
    name:
      - docker.io
      - git
      - curl
    state: present

- name: Enable Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true

- name: Start Docker service
  ansible.builtin.systemd:
    name: docker
    state: started

- name: Add ubuntu user to docker group
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true