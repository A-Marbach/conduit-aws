---
- name: Create application directory
  ansible.builtin.file:
    path: /opt/conduit
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Clone conduit repository
  become: true
  become_user: ubuntu
  ansible.builtin.git:
    repo: https://github.com/A-Marbach/conduit-container.git
    dest: /opt/conduit
    version: main
    recursive: true
    update: true

- name: Create backend environment file
  ansible.builtin.template:
    src: backend.env.j2
    dest: /opt/conduit/backend/.env
    owner: ubuntu
    group: ubuntu
    mode: "0644"

- name: Pull Docker images
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: /opt/conduit


- name: Start application
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /opt/conduit